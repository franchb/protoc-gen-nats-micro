edition = "2026";

package common.types.v1;

import "google/protobuf/go_features.proto";

option go_package = "example/gen/common/types/v1";
option features.(pb.go).api_level = API_OPAQUE;

// Status represents the lifecycle state of an entity
export enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
  STATUS_PENDING = 3;
  STATUS_DELETED = 4;
}
