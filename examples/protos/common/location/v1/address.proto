edition = "2026";

package common.location.v1;

import "google/protobuf/go_features.proto";

option go_package = "example/gen/common/location/v1";
option features.(pb.go).api_level = API_OPAQUE;

// Address represents a physical address
export message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip_code = 4;
  string country = 5;
}
