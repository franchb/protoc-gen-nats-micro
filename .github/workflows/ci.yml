name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: tools/protoc-gen-nats-micro

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27.0", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build root module
        run: go build ./...

      - name: Install Buf v1.75.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/buf" \
            "https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-Linux-x86_64"
          chmod +x "$RUNNER_TEMP/buf"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/buf" --version

      - name: Run tests with coverage
        working-directory: tools/protoc-gen-nats-micro
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7.1.1
        with:
          files: tools/protoc-gen-nats-micro/coverage.out
          flags: go-${{ matrix.go-version }}
          token: ${{ secrets.CODECOV_TOKEN || '' }}
